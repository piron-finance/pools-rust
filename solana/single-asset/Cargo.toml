[package]
name = "piron-single-asset-solana"
description = "Solana binding for Piron Single-Asset pools. Accounts, PDAs, signers, CPI."
# Concrete rather than inherited: the crate sits outside the workspace, so there is no
# root to inherit from. Keep these in step with [workspace.package] in the root manifest.
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "piron_single_asset_solana"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
piron-core = { path = "../../crates/piron-core" }
# Anchor 1.x, not the 0.31 the scaffold guessed at: Anchor cut a 1.0 release and the two
# lines differ enough that the guess would have failed at the first build.
#
# Excluded from the workspace on purpose. Solana builds through `cargo-build-sbf`, which
# brings its own toolchain rather than honouring rust-toolchain.toml.
# init-if-needed: the position account is created on a holder's first deposit and reused
# after. Anchor gates the feature because a careless init_if_needed is a re-initialisation
# attack; here the account is a PDA seeded on (pool, owner), so a second init resolves to
# the same address and the handler treats an existing position as existing.
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
