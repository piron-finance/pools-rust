[package]
name = "pool-escrow"
description = "Segregated fund custody for one Piron pool."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "27.0.6"
piron-types = { path = "../piron-types" }

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
