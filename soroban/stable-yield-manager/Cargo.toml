[package]
name = "stable-yield-manager"
description = "Soroban binding for Piron Stable Yield (revolving, NAV-priced) pools."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
piron-core = { path = "../../crates/piron-core" }
piron-types = { path = "../piron-types" }
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
pool-escrow = { path = "../pool-escrow" }
pool-share = { path = "../pool-share" }
