[package]
name = "access-manager"
description = "Role-based access control with timelocked grants for Piron."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
piron-core = { path = "../../crates/piron-core" }
soroban-sdk = "27.0.6"
piron-types = { path = "../piron-types" }

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
